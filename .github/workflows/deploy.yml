name: Deploy

# Runs when CI has passed on main, or by hand (Actions -> Deploy -> Run workflow), so what is
# deployed has always been tested.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auth-gateway-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: passwordnotsafe/auth-gateway
  DEPLOY_DIR: /home/repos/auth-gateway

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever is on main right now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.jarllindquist.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/server-deploy SSH_HOST | SERVER_HOST ;
            kv/data/server-deploy SSH_USERNAME | SERVER_USER ;
            kv/data/server-deploy SERVER_PORT | SERVER_PORT ;
            kv/data/server-deploy SSH_PRIVATE_KEY | SERVER_PRIVATE_KEY ;
            kv/data/server-deploy SSH_HOST_FINGERPRINT | SSH_HOST_FINGERPRINT ;
            kv/data/server-deploy DOCKER_USERNAME | DOCKER_USERNAME ;
            kv/data/server-deploy DOCKER_PASSWORD | DOCKER_PASSWORD

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push the image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}

      # The appleboy actions are pinned to a commit and check the server's identity against the
      # fingerprint in Vault.
      - name: Copy the compose file to the server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          port: ${{ env.SERVER_PORT }}
          fingerprint: ${{ env.SSH_HOST_FINGERPRINT }}
          source: docker-compose.prod.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Start on the server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          port: ${{ env.SERVER_PORT }}
          fingerprint: ${{ env.SSH_HOST_FINGERPRINT }}
          envs: DEPLOY_DIR
          script: |
            set -e
            cd "$DEPLOY_DIR"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Check that the login page answers
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://jarllindquist.com/auth/health; then echo; echo "jarllindquist.com/auth answers"; exit 0; fi
            sleep 3
          done
          echo "jarllindquist.com/auth/health did not answer after the deploy"
          exit 1
