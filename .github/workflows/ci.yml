name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - name: Tests
        run: pytest -q
      - name: Known vulnerabilities in the dependencies
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t auth-gateway:ci .
      # Started the way production runs it: read-only file system, /tmp in memory
      - name: The image starts and answers
        run: |
          docker run -d --name gw --read-only --tmpfs /tmp -p 8000:8000 auth-gateway:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/auth/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/auth/health
          # Without a session, verify must never answer 200
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Host: grafana.jarllindquist.com' http://127.0.0.1:8000/auth/verify)
          echo "verify without a session: $code"
          test "$code" = "302"
      - name: Container logs
        if: always()
        run: docker logs gw || true
