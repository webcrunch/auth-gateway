# Production: the image is built and tested in GitHub Actions and pulled from Docker Hub.
#
# Traefik sends jarllindquist.com/auth/* here (the login page), and every service that should be
# locked uses the middleware defined below:
#   - "traefik.http.routers.<name>.middlewares=ops-auth@docker"
# Traefik then asks /auth/verify before each request; 200 lets it through with X-WEBAUTH-USER set
# (replacing anything the browser sent), anything else sends the browser to the login page.
services:
  auth-gateway:
    image: passwordnotsafe/auth-gateway:latest
    container_name: auth-gateway
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      # The tools behind the login, as links on the page once logged in ("Name=/path/;...").
      # Add one here when a new service gets the ops-auth middleware.
      - TOOLS=Grafana=/grafana/;Prometheus=/prometheus/;PocketBase=https://pb.jarllindquist.com/_/;HeimState=/heim/
      # Machine access without Telegram (see app.py): name|sha256 of the token|expires|host|prefix.
      # Only the hash is here. claude-heim: reads the HeimState API while the dashboard is built.
      # phone-widget: the Android widget, ?key= in the URL, exactly /heim/api/widget (no occupancy).
      - SERVICE_TOKENS=claude-heim|3c86959a927ce94ed4543ca1f00b91c4ab2ca650c7cb30a329fc177a3afeed41|2026-11-26T08:00:00Z|jarllindquist.com|/heim/api/;phone-widget|bdc111cf9a24694e51cabc3aca970896cecb3b246553e52112577edb6a4456a2|2027-11-19T00:00:00Z|jarllindquist.com|/heim/api/widget|query
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-gateway.rule=Host(`jarllindquist.com`) && PathPrefix(`/auth`)"
      - "traefik.http.routers.auth-gateway.entrypoints=websecure"
      - "traefik.http.routers.auth-gateway.tls.certresolver=myresolver"
      - "traefik.http.services.auth-gateway.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.ops-auth.forwardauth.address=http://auth-gateway:8000/auth/verify"
      - "traefik.http.middlewares.ops-auth.forwardauth.authResponseHeaders=X-WEBAUTH-USER"
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
